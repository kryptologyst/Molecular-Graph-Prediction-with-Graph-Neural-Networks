# @package train
_target_: src.train.trainer.Trainer

# Training settings
epochs: 100
lr: 0.001
weight_decay: 1e-4
optimizer: adam
scheduler: cosine

# Loss function
loss_fn: bce_with_logits
class_weight: null  # null, balanced, or custom weights

# Early stopping
early_stopping: true
patience: 20
min_delta: 1e-4

# Gradient clipping
grad_clip: null  # null or max_norm value

# Mixed precision
use_amp: false
